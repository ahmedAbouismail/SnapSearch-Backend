
image:  delphairegistry/dind-az-kctl-helm:v1.6
stages:
  - test
  - build

test:image_embeddings:
  tags:
    - linux 

  stage: test
  script: 
   - set -e
   - cd snap_search/backend/image_embeddings
   - pipenv lock -r > requirements.txt
   - pip install -r requirements.txt
   - python3 image_embeddings/knn/test_knn.py
  
build:image_embeddings:
  tags:
    - linux 
  stage: build
  script: 
    - docker login $CI_REGISTRY -u $CI_USERNAME -p $CI_REGISTRY_PASSWORD
    - docker build -t $CI_REGISTRY_IMAGE snap_search/backend/image_embeddings
    - docker push  $CI_REGISTRY_IMAGE


