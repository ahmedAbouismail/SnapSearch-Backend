
test_and_build:
  image:  docker:latest

  stage: build
  tags:
   - linux 
   
  script: 
   - docker
   - cat ~/.docker/config.json
   - docker login $CI_REGISTRY -u "$CI_REGISTRY_PASSWORD" -p "$CI_REGISTRY_PASSWORD"
   - docker build -t $CI_REGISTRY_IMAGE .
   - docker push  $CI_REGISTRY_IMAGE


