test_and_build:
  image: teracy/ubuntu:18.04-dind-latest

  stage: build
  tags:
    - azure
  script:
    
    - docker
    - docker login $CI_REGISTRY -u "abudimo" -p "$CI_REGISTRY_PASSWORD"
    - curl -sL https://aka.ms/InstallAzureCLIDeb |  bash
    - pwd
    - cd snap_search/backend/image_embeddings
    - docker build -t abudimo/snapsearch:latest .
    - docker push  abudimo/snapsearch:latest
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account show
    - az container restart -n snapsearch-ci -g snapsearch

